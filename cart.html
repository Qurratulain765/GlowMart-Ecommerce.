<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlowMart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold branding-text" href="index.html">GlowMart</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#cartNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="cartNav">
                <ul class="navbar-nav ms-auto fw-medium">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="product.html">Shop</a></li>
                    <li class="nav-item"><a class="nav-link active-link" href="cart.html">Cart (<span id="nav-cart-count">0</span>)</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <h2 class="fw-bold text-dark mb-4">Shopping Cart</h2>
        
        <div class="row g-4">
            <div class="col-lg-8">
                <div class="p-4 bg-white rounded-4 shadow-sm" id="cart-wrapper">
                    <p class="text-muted my-3 text-center" id="empty-message">Your cart is currently empty.</p>
                </div>
            </div>
            
            <div class="col-lg-4">
                <div class="p-4 bg-white rounded-4 shadow-sm border border-light">
                    <h4 class="fw-bold text-dark mb-3">Summary</h4>
                    <hr class="text-muted">
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted">Subtotal</span>
                        <span class="fw-semibold text-dark" id="subtotal-price">$0.00</span>
                    </div>
                    <div class="d-flex justify-content-between mb-3">
                        <span class="text-muted">Shipping</span>
                        <span class="text-success fw-medium">Free</span>
                    </div>
                    <hr class="text-muted">
                    <div class="d-flex justify-content-between mb-4">
                        <span class="fs-5 fw-bold text-dark">Total</span>
                        <span class="fs-5 fw-bold text-primary-color" id="final-total">$0.00</span>
                    </div>
                    <a href="checkout.html" class="btn btn-rose-pink w-100 rounded-pill py-2.5 fw-medium shadow-sm">
                        Proceed to Checkout
                    </a>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-white border-top py-3 text-center mt-auto">
        <div class="container">
            <p class="text-muted mb-0 small">&copy; 2026 GlowMart. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
