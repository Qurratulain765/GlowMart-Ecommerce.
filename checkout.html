<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlowMart - Checkout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold branding-text" href="index.html">GlowMart</a>
            <div class="collapse navbar-collapse" id="checkoutNav">
                <ul class="navbar-nav ms-auto fw-medium">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="product.html">Shop</a></li>
                    <li class="nav-item"><a class="nav-link" href="cart.html">Cart (<span id="nav-cart-count">0</span>)</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <h2 class="fw-bold text-dark mb-4">Checkout Details</h2>
        
        <div class="row g-4">
            <div class="col-lg-7">
                <div class="p-4 bg-white rounded-4 shadow-sm">
                    <h4 class="mb-4 fw-bold">Shipping Information</h4>
                    <form id="checkout-form" onsubmit="handleCheckout(event)">
                        <div class="mb-3">
                            <label class="form-label small fw-medium">Full Name</label>
                            <input type="text" id="bill-name" class="form-control rounded-3" placeholder="John Doe" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-medium">Email Address</label>
                            <input type="email" id="bill-email" class="form-control rounded-3" placeholder="john@example.com" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-medium">Shipping Address</label>
                            <input type="text" id="bill-address" class="form-control rounded-3" placeholder="Street 123, House No. 4" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label small fw-medium">City</label>
                                <input type="text" id="bill-city" class="form-control rounded-3" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label small fw-medium">Phone Number</label>
                                <input type="tel" id="bill-phone" class="form-control rounded-3" placeholder="03XXXXXXXXX" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-rose-pink w-100 rounded-pill py-2.5 mt-3 fw-medium">
                            Place Order (Cash on Delivery)
                        </button>
                    </form>
                </div>
            </div>
            
            <div class="col-lg-5">
                <div class="p-4 bg-white rounded-4 shadow-sm border border-light">
                    <h4 class="fw-bold text-dark mb-3">Your Order</h4>
                    <hr class="text-muted">
                    <div id="checkout-summary-items" class="mb-3" style="max-height: 250px; overflow-y: auto;">
                        </div>
                    <hr class="text-muted">
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted">Subtotal</span>
                        <span class="fw-semibold text-dark" id="checkout-subtotal">$0.00</span>
                    </div>
                    <div class="d-flex justify-content-between mb-4">
                        <span class="fs-5 fw-bold text-dark">Total</span>
                        <span class="fs-5 fw-bold text-primary-color" id="checkout-total">$0.00</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-white border-top py-3 text-center mt-auto">
        <div class="container">
            <p class="text-muted mb-0 small">&copy; 2026 GlowMart. All rights reserved.</p>
        </div>
    </footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
